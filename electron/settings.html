<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Configurar servidor</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        background: #101a15;
        color: #eef5ef;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #9fb3a6;
        margin: 0 0 16px;
        line-height: 1.5;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #2a3f33;
        background: #0c1410;
        color: #eef5ef;
        font-size: 13px;
      }
      input:focus {
        outline: 2px solid #2f8f5b;
        outline-offset: 1px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        justify-content: flex-end;
      }
      button {
        padding: 9px 16px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #2f8f5b;
        color: white;
      }
      button.secondary {
        background: transparent;
        color: #9fb3a6;
      }
      .status {
        font-size: 11px;
        color: #e0a25c;
        min-height: 14px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Endereço do servidor KAV DECK</h1>
    <p>Informe a URL da API do backend (ex.: https://api.suaempresa.com.br/api/v1). O app reinicia sozinho após salvar.</p>
    <input id="apiUrl" type="text" placeholder="https://api.suaempresa.com.br/api/v1" autofocus />
    <div class="status" id="status"></div>
    <div class="row">
      <button class="secondary" id="cancel">Cancelar</button>
      <button class="primary" id="save">Salvar e reiniciar</button>
    </div>
    <script>
      const input = document.getElementById("apiUrl");
      const statusEl = document.getElementById("status");

      window.kavSettings.getApiUrl().then((url) => {
        input.value = url || "";
      });

      document.getElementById("cancel").addEventListener("click", () => window.close());
      document.getElementById("save").addEventListener("click", async () => {
        const value = input.value.trim();
        if (!/^https?:\/\/.+/.test(value)) {
          statusEl.textContent = "Informe uma URL válida (iniciando com http:// ou https://).";
          return;
        }
        await window.kavSettings.setApiUrl(value);
      });
    </script>
  </body>
</html>
